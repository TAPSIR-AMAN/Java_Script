<body>
    <script>
        class password {
            strongpassword() {
                let capital = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                let small = "abcdefghijklmnopqrstuvwxyz"
                let number = "0123456789"
                let special = "!@#$%^&*()_?"


                let C_char = capital.charAt(Math.floor(Math.random() * capital.length))
                let S_char = small.charAt(Math.floor(Math.random() * small.length))
                let Sp_char = special.charAt(Math.floor(Math.random() * special.length))
                let N_char = number.charAt(Math.floor(Math.random() * number.length));

                let S_password = []

                for (let i = 0; i < 2; i++) {
                    S_password.push(capital.charAt(Math.floor(Math.random() * capital.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))
                    S_password.push(special.charAt(Math.floor(Math.random() * special.length)))
                    S_password.push(number.charAt(Math.floor(Math.random() * number.length)))
                    S_password.push(special.charAt(Math.floor(Math.random() * special.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))

                }
                let pass = S_password.join("")
                // alert(`password:${pass}`)

                console.log(`password:${pass}`)
                document.write(`password:${pass}`)
            }
            weakpassword() {
                let capital = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                let small = "abcdefghijklmnopqrstuvwxyz"
                let number = "0123456789"
                let S_password = []

                for (let i = 0; i < 2; i++) {
                    S_password.push(capital.charAt(Math.floor(Math.random() * capital.length)))
                    S_password.push(number.charAt(Math.floor(Math.random() * number.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))

                }
                let pass = S_password.join("")
                // alert(`password:${pass}`)

                console.log(`password:${pass}`)
                document.write(`password:${pass}`)

            }
            funnypassword() {
                let capital = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                let small = "abcdefghijklmnopqrstuvwxyz"
                let S_password = []

                for (let i = 0; i < 2; i++) {
                    S_password.push(capital.charAt(Math.floor(Math.random() * capital.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))
                    S_password.push(small.charAt(Math.floor(Math.random() * small.length)))

                }
                let pass = S_password.join("")
                // alert(`password:${pass}`)

                console.log(`password:${pass}`)
                document.write(`password:${pass}`)
            }

        }
        let a = new password()
        // a.strongpassword()
        let inp = prompt("level of password you need:\n 0 1 2")
        if (inp == 0) {
            a.funnypassword()
        }
        else if (inp == 1) {
            a.weakpassword()
        }
        else {
            a.strongpassword()
        }
