        // optimised once?
        class password {
            constructor() {
                // Declare character sets once
                this.capital = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                this.small = "abcdefghijklmnopqrstuvwxyz";
                this.number = "0123456789";
                this.special = "!@#$%^&*()_?";
            }
            getRandomChar(str) {
                return str.charAt(Math.floor(Math.random() * str.length));
            }
            strongpassword() {
                let strong_password = [];
                for (let i = 0; i < 2; i++) {
                    strong_password.push(this.getRandomChar(this.capital));
                    strong_password.push(this.getRandomChar(this.small));
                    strong_password.push(this.getRandomChar(this.special));
                    strong_password.push(this.getRandomChar(this.number));
                    strong_password.push(this.getRandomChar(this.special));
                    strong_password.push(this.getRandomChar(this.small));
                }
                let pass = strong_password.join("");
                console.log(`Strong password: ${pass}`);
                document.write(`Strong password: ${pass}`);

            }
            weakpassword() {
                let weak_password = [];
                for (let i = 0; i < 2; i++) {
                    weak_password.push(this.getRandomChar(this.capital));
                    weak_password.push(this.getRandomChar(this.number));
                    weak_password.push(this.getRandomChar(this.small));
                    weak_password.push(this.getRandomChar(this.small));
                    weak_password.push(this.getRandomChar(this.small));
                }
                let pass = weak_password.join("");
                console.log(`Weak password: ${pass}`);
                document.write(`Weak password: ${pass}`);
            }
            funnypassword() {

                let funny_password = [];
                for (let i = 0; i < 2; i++) {
                    funny_password.push(this.getRandomChar(this.capital));
                    funny_password.push(this.getRandomChar(this.small));
                    funny_password.push(this.getRandomChar(this.small));
                    funny_password.push(this.getRandomChar(this.small));
                }
                let pass = funny_password.join("");
                console.log(`Funny password: ${pass}`);
                document.write(`Funny password: ${pass}`);
            }

        }
        let a = new password()
        // a.strongpassword()
        let inp = prompt("level of password you need:\n 0 1 2")
        if (inp == 0) {
            a.funnypassword()
        }
        else if (inp == 1) {
            a.weakpassword()
        }
        else {
            a.strongpassword()
        }
