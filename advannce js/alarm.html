<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Top right small clock */
        .small-clock {
            position: absolute;
            top: 10px;
            right: 15px;
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Container for the clock */
        .clock-container {
            width: 800px;
            margin: 60px auto;
            text-align: center;
        }

        .clock-container h1 {
            margin-bottom: 20px;
        }

        /* Main clock */
        .clock {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .box {
            height: 150px;
            width: 150px;
            background-color: gray;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        .label {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .alam {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        h3 {
            text-align: center;
            font-size: 60px;
            font-weight: bolder;
        }

        .alam input {
            width: 150px;
            height: 150px;
            font-size: 24px;
            /* increase text size */
            text-align: center;
            /* optional: center the text */
            padding: 8px;
        }

        .alam div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>


    <!-- Main clock container -->
    <div class="clock-container">
        <h1>Clock</h1>
        <div class="clock">
            <div class="time-block">
                <div class="box hour"></div>
                <div class="label">Hour</div>
            </div>
            <div class="time-block">
                <div class="box min"></div>
                <div class="label">Minute</div>
            </div>
            <div class="time-block">
                <div class="box sec"></div>
                <div class="label">Second</div>
            </div>
        </div>

    </div>
    <h3>Set your alarm</h3>
    <div class="alam">
        <div class="hour">
            <div class="box"><input type="text" id="hour"></div>
            <div class="label hou">Hour</div>
        </div>
        <div class="minute">
            <div class="box hour min"><input type="text " id="minute"></div>
            <div class="label">Minute</div>
        </div>
        <div class="second">
            <div class="box hour sec"><input type="text" id="second"></div>
            <div class="label">Second</div>
        </div>
        <button class="btn">Set Alarm</button>
    </div>
    <audio id="my_audio" src="/advannce js/colossal-dragon-roar-329856.mp3"></audio>


    <script>
        let hh, mm, ss;
        function updateClock() {
            let a = new Date();
            let h = a.getHours();
            let m = a.getMinutes();
            let s = a.getSeconds();

            // Format with leading zeros
            hh = (h < 10 ? "0" : "") + h;
            mm = (m < 10 ? "0" : "") + m;
            ss = (s < 10 ? "0" : "") + s;



            // Main clock
            document.getElementsByClassName("hour")[0].innerText = hh;
            document.getElementsByClassName("min")[0].innerText = mm;
            document.getElementsByClassName("sec")[0].innerText = ss;
        }

        updateClock(); // Run once immediately
        
        // setInterval(() => {
            //     
            // }, 1000);
            let h;
            let m;
            let s;
            let input_h = document.querySelector("#hour");
            input_h.addEventListener("input", () => {
                h = input_h.value;
            });
            
            let input_m = document.querySelector("#minute");
            input_m.addEventListener("input", () => {
                m = input_m.value;
            });
            let input_s = document.querySelector("#second");
            input_s.addEventListener("input", () => {
                s = input_s.value;
            });
            
            
            let btn = document.querySelector(".btn");
            let h1,m1,s1;
            btn.addEventListener("click", () => {
                h1 = h;
                m1 = m;
                s1 = s;
            })
            
            
            setInterval(()=>{
                
                updateClock(); // Run once immediately
                if (hh == h1 && mm == m1) {
                let x = document.querySelector("#my_audio")
                x.play() 
            }
            }, 1000); // Update every second
            </script>
</body>

</html>
