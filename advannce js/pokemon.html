<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<style>
    #container{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        flex-direction: column;
    }
</style>
<body>

    <div id="container">

    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <script>
        let a = fetch("https://pokeapi.co/api/v2/pokemon")
        a.then((response) => {
            return response.json()
        }).then((value) => {
            console.log(value)
            let ar = value.results;
            console.log(ar)
            let ihtml = document.getElementById("container");
            let id=0;
            let imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
            for (item in ar) {
                // console.log(ar[item].name)
                ihtml.innerHTML += `
                <div class="card" style="width: 18rem;">
                <img src="${imageUrl}" class="card-img-top" alt="...">
                <div class="card-body">
                <h5 class="card-title">${ar[item].name}</h5>
                <p class="card-text"></p>
                <a href="${ar[item].url}" class="btn btn-primary">Go somewhere</a>
                </div>
                </div>`
            }
        })


    </script>
</body>

</html>
